<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassageNote — 영어 원문·문제 풀이 학습 노트 (단일 HTML 버전)</title>
    <meta
      name="description"
      content="프레임워크·빌드 없이 브라우저에서 바로 실행되는 수능·내신 영어 원문 독해, 문제 풀이, 영작 서술형 학습 노트"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-soft: #f1f5f9;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --text: #0f172a;
        --text-muted: #475569;
        --text-subtle: #64748b;
        --primary: #1d4ed8;
        --primary-hover: #1e40af;
        --primary-soft: #eff6ff;
        --primary-border: #bfdbfe;
        --emerald: #047857;
        --emerald-soft: #ecfdf5;
        --emerald-border: #a7f3d0;
        --amber: #b45309;
        --amber-soft: #fffbeb;
        --amber-border: #fde68a;
        --red: #b91c1c;
        --red-soft: #fef2f2;
        --red-border: #fecaca;
        --font-sans: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Source Serif 4', 'Noto Sans KR', Georgia, serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .font-editorial {
        font-family: var(--font-serif);
      }

      .font-mono-tabular {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* TopBar */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 20px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 0;
        font-family: var(--font-serif);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        white-space: nowrap;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 22px;
        overflow-x: auto;
      }

      .nav-btn {
        position: relative;
        background: none;
        border: none;
        padding: 8px 2px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .nav-btn:hover {
        color: var(--text);
      }

      .nav-btn.active {
        color: var(--text);
        font-weight: 700;
      }

      .nav-btn.active::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -11px;
        height: 2px;
        background: var(--primary);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 15px;
        border: 1px solid transparent;
        transition: background-color 0.15s ease, border-color 0.15s ease;
        white-space: nowrap;
      }

      .btn-sm {
        padding: 6px 11px;
        font-size: 12px;
        border-radius: 7px;
      }

      .btn-primary {
        background: var(--primary);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      .btn-dark {
        background: #0f172a;
        color: #ffffff;
      }

      .btn-dark:hover:not(:disabled) {
        background: #1e293b;
      }

      .btn-outline {
        background: #ffffff;
        color: var(--text);
        border-color: var(--border-strong);
      }

      .btn-outline:hover:not(:disabled) {
        background: var(--bg);
      }

      .btn-soft {
        background: var(--surface-soft);
        color: var(--text-muted);
        border-color: var(--border);
      }

      .btn-soft:hover:not(:disabled) {
        background: #e2e8f0;
        color: var(--text);
      }

      .btn-danger-soft {
        background: var(--red-soft);
        color: var(--red);
        border-color: var(--red-border);
      }

      .mobile-nav {
        display: none;
        border-top: 1px solid #f1f5f9;
        padding: 6px 12px;
        gap: 6px;
        overflow-x: auto;
      }

      /* Main Container */
      .main-wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px 20px 88px;
      }

      .feed-layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      /* Sidebar */
      .sidebar {
        overflow: hidden;
      }

      .sidebar-head {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .sidebar-title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .input-box {
        width: 100%;
        padding: 9px 12px;
        font-size: 13px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
      }

      .input-box:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .seg-grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 4px;
        background: var(--surface-soft);
        border-radius: 8px;
      }

      .seg-btn {
        background: transparent;
        border: none;
        padding: 6px 4px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        border-radius: 6px;
      }

      .seg-btn.active {
        background: #ffffff;
        color: var(--text);
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }

      .feed-list {
        max-height: calc(100vh - 255px);
        overflow-y: auto;
      }

      .feed-item {
        width: 100%;
        text-align: left;
        background: #ffffff;
        border: none;
        border-bottom: 1px solid #f1f5f9;
        padding: 14px 16px;
        display: block;
      }

      .feed-item:hover {
        background: #f8fafc;
      }

      .feed-item.selected {
        background: #eff6ff;
      }

      .feed-item-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--text-subtle);
      }

      .feed-item-title {
        margin: 5px 0 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--text);
      }

      .feed-item.selected .feed-item-title {
        color: #1e3a8a;
      }

      .feed-item-foot {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }

      .status-ok {
        color: var(--emerald);
        font-weight: 600;
      }

      .status-review {
        color: var(--amber);
        font-weight: 600;
      }

      /* Workspace */
      .ws-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-subtle);
      }

      .tag-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface-soft);
        color: var(--text-muted);
      }

      .tag-badge.blue {
        background: var(--primary-soft);
        border-color: var(--primary-border);
        color: #1e40af;
      }

      .tag-badge.emerald {
        background: var(--emerald-soft);
        border-color: var(--emerald-border);
        color: var(--emerald);
      }

      .ws-title {
        margin: 8px 0 4px;
        font-family: var(--font-serif);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
      }

      .ws-summary {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-muted);
      }

      .ws-grid {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        align-items: start;
      }

      .ws-left {
        padding: 20px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .ws-right {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: #f8fafc;
      }

      .tab-btn {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .tab-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #ffffff;
      }

      .ws-body {
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .photo-stage {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0f172a;
        overflow: auto;
        max-height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }

      .photo-stage img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        transform-origin: center top;
        transition: transform 0.15s ease;
      }

      .thumb-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .thumb-btn {
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 3px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .thumb-btn.active {
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }

      .thumb-btn img {
        width: 58px;
        height: 44px;
        object-fit: cover;
        border-radius: 5px;
      }

      .passage-box {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        background: #f8fafc;
        font-size: 13.5px;
        line-height: 1.75;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .sentence-inline.evidence {
        background: #fef3c7;
        border-radius: 4px;
        padding: 1px 3px;
      }

      .choice-card {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .choice-card.selected {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .choice-card.correct {
        border-color: var(--emerald-border);
        background: var(--emerald-soft);
      }

      .choice-card.wrong {
        border-color: var(--red-border);
        background: var(--red-soft);
      }

      .subpanel {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        background: #ffffff;
      }

      .subpanel.soft {
        background: #f8fafc;
      }

      .subpanel.emerald {
        background: var(--emerald-soft);
        border-color: var(--emerald-border);
      }

      .subpanel.amber {
        background: var(--amber-soft);
        border-color: var(--amber-border);
      }

      .subpanel.blue {
        background: var(--primary-soft);
        border-color: var(--primary-border);
      }

      .step-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .english-mono {
        font-family: var(--font-serif);
        font-size: 15px;
        line-height: 1.65;
        color: var(--text);
      }

      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 12px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .kpi-card {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #f8fafc;
      }

      /* Modals & Drawers */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .backdrop.hidden {
        display: none;
      }

      .modal-card {
        width: 100%;
        max-width: 820px;
        max-height: 92vh;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
      }

      .modal-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-body {
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .crop-stage {
        position: relative;
        user-select: none;
        touch-action: none;
        display: inline-block;
        max-width: 100%;
        cursor: crosshair;
      }

      .crop-stage img {
        display: block;
        max-width: 100%;
        max-height: 290px;
        border-radius: 6px;
      }

      .crop-box {
        position: absolute;
        border: 2px solid #2563eb;
        background: rgba(37, 99, 235, 0.16);
        pointer-events: none;
      }

      .dropzone {
        border: 2px dashed var(--border-strong);
        border-radius: 12px;
        padding: 28px 16px;
        text-align: center;
        background: #f8fafc;
      }

      .dropzone.dragging {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      /* Floating Tutor Button & Drawer */
      .floating-tutor-btn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 40;
        padding: 12px 18px;
        border-radius: 12px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 55;
        background: rgba(15, 23, 42, 0.38);
        display: flex;
        justify-content: flex-end;
      }

      .drawer-backdrop.hidden {
        display: none;
      }

      .drawer-panel {
        width: 100%;
        max-width: 480px;
        height: 100%;
        background: #ffffff;
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        box-shadow: -12px 0 36px rgba(15, 23, 42, 0.16);
      }

      .chat-thread {
        flex: 1;
        min-height: 140px;
        overflow-y: auto;
        padding: 16px;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat-bubble {
        max-width: 90%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .chat-bubble.user {
        align-self: flex-end;
        background: var(--primary);
        color: #ffffff;
      }

      .chat-bubble.model {
        align-self: flex-start;
        background: #ffffff;
        border: 1px solid var(--border);
        color: var(--text);
      }

      .chip-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-btn {
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 500;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--text-muted);
      }

      .chip-btn.active {
        background: var(--primary-soft);
        border-color: var(--primary);
        color: #1e3a8a;
        font-weight: 600;
      }

      .notice-box {
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.5;
        border: 1px solid var(--border);
      }

      .notice-box.success {
        background: var(--emerald-soft);
        border-color: var(--emerald-border);
        color: var(--emerald);
      }

      .notice-box.error {
        background: var(--red-soft);
        border-color: var(--red-border);
        color: var(--red);
      }

      @media (max-width: 980px) {
        .feed-layout {
          grid-template-columns: 1fr;
        }
        .ws-grid {
          grid-template-columns: 1fr;
        }
        .ws-left {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .kpi-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 720px) {
        .nav-links {
          display: none;
        }
        .mobile-nav {
          display: flex;
        }
        .topbar-inner {
          height: 56px;
          padding: 0 14px;
        }
        .main-wrap {
          padding: 16px 12px 84px;
        }
      }
    </style>
  <script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <button type="button" class="brand-btn" id="brandHomeBtn">PassageNote</button>
        <nav class="nav-links" id="desktopNav" aria-label="주요 메뉴"></nav>
        <div style="display: flex; align-items: center; gap: 8px">
          <button type="button" class="btn btn-primary" id="openSnapBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
              <circle cx="12" cy="13" r="3" />
            </svg>
            <span>새 문제·노트 등록</span>
          </button>
        </div>
      </div>
      <nav class="mobile-nav" id="mobileNav" aria-label="모바일 메뉴"></nav>
    </header>

    <main class="main-wrap" id="appRoot"></main>

    <button type="button" class="floating-tutor-btn" id="openTutorBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <span>학습 코치 채팅</span>
    </button>

    <!-- New Problem / Note Modal -->
    <div class="backdrop hidden" id="snapModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="snapModalTitle">
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <h2 id="snapModalTitle" style="margin: 0; font-size: 16px; font-weight: 700">
              새 영어·한국어 문제 / 원문 등록

            .replace(/(?:^|\n)\s*(?:[①②③④⑤]|\([1-5]\)|[1-5]\))\s+[^\n]+/g, ' ')
            .replace(/<보기>[^\n]*/g, ' ')
            .replace(/<조건>[\s\S]*?(?=\n\n|$)/g, ' ');
          var rawSentences = englishOnlyBlocks.match(/[A-Z][^.!?]*[.!?]/g) || [];
          var sentences = [];
          for (var s = 0; s < rawSentences.length; s++) {
            var orig = rawSentences[s].replace(/\s+/g, ' ').trim();
            if (orig.split(/\s+/).length < 3) continue;
            sentences.push({
              index: sentences.length + 1,

            });
          }

          var firstLine = text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean)[0] || '';
          var title = opts.sourceTag ? opts.sourceTag : (firstLine ? firstLine.slice(0, 26) : '영어 학습 노트');

        // Image utilities (works offline / file://)
        function readFileAsDataUrl(file) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = function () { reject(new Error('이미지 파일을 읽지 못했습니다.')); };
            reader.readAsDataURL(file);
          });
        }

        function loadImg(src) {
          return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () { resolve(img); };
            img.onerror = function () { reject(new Error('이미지를 불러오지 못했습니다.')); };
            img.src = src;
          });
        }

        function rotateDataUrl(src, deg) {
          return loadImg(src).then(function (img) {
            var canvas = document.createElement('canvas');
            canvas.width = img.naturalHeight;
            canvas.height = img.naturalWidth;
            var ctx = canvas.getContext('2d');
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((deg * Math.PI) / 180);
            ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
            return canvas.toDataURL('image/jpeg', 0.9);
          });
        }

        function compressAndCrop(src, crop, maxDim) {
          return loadImg(src).then(function (img) {
            var sx = crop ? Math.max(0, Math.round(crop.x * img.naturalWidth)) : 0;
            var sy = crop ? Math.max(0, Math.round(crop.y * img.naturalHeight)) : 0;
            var sw = crop ? Math.max(20, Math.round(crop.width * img.naturalWidth)) : img.naturalWidth;
            var sh = crop ? Math.max(20, Math.round(crop.height * img.naturalHeight)) : img.naturalHeight;
            sw = Math.min(sw, img.naturalWidth - sx);
            sh = Math.min(sh, img.naturalHeight - sy);
            var scale = Math.min(1, maxDim / Math.max(sw, sh));
            var tw = Math.max(1, Math.round(sw * scale));
            var th = Math.max(1, Math.round(sh * scale));
            var canvas = document.createElement('canvas');
            canvas.width = tw;
            canvas.height = th;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, tw, th);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);
            return canvas.toDataURL('image/jpeg', 0.84);
          });
        }

                  '<div class="english-mono" style="margin-top:6px;font-weight:700">' + (state.hideModelAnswer ? '(직접 머릿속으로 완성한 뒤 답안 보기를 눌러 확인하세요)' : escapeHtml(ws.modelAnswer)) + '</div>' +

              tabBody += sentsGram.length === 0

                        '</div>';
                      }).join('') +
                    '</div>';
                  }).join('');
            } else if (state.activeTab === 'vocab') {
              var vocs = selected.analysis.vocabulary || [];
              tabBody +=
                '<div class="vocab-grid">' +
                  vocs.map(function (v) {
                    return '<div class="step-card">' +
                      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
                        '<div><strong style="font-size:15px">' + escapeHtml(v.word) + '</strong> <span style="font-size:11px;color:var(--text-subtle)">' + escapeHtml(v.partOfSpeech) + '</span></div>' +
                        '<button type="button" class="btn btn-sm ' + (v.memorized ? 'btn-dark' : 'btn-outline') + '" data-toggle-vocab="' + escapeHtml(v.id) + '">' + (v.memorized ? '암기 완료' : '암기 체크') + '</button>' +

                      '<div style="font-size:11.5px;color:var(--text-subtle);font-style:italic">' + escapeHtml(v.exampleInPassage) + '</div>' +

              '<div class="subpanel soft" style="margin-top:8px;display:flex;flex-direction:column;gap:10px">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
                  '<strong style="font-size:13px">풀이 방식 선택 &amp; 추가 질문</strong>' +
                  '<div class="chip-group">' +
                    SOLVE_STYLES.map(function (st) {
                      return '<button type="button" class="chip-btn ' + (state.followUpStyle === st.id ? 'active' : '') + '" data-fstyle="' + st.id + '">' + st.label + '</button>';
                    }).join('') +
                  '</div>' +
                '</div>' +
                '<div class="chip-group">' +
                  '<button type="button" class="chip-btn" data-fqpreset="이 문제를 어떤 방식으로 풀이·정리하면 가장 이해하기 쉬울지 알려주세요.">어떤 풀이 방식이 좋을지 물어보기</button>' +
                  '<button type="button" class="chip-btn" data-fqpreset="이 지문의 핵심 문법과 내신 함정 포인트를 정리해 주세요.">핵심 문법·함정 요약</button>' +
                '</div>' +
                '<div style="display:flex;gap:8px">' +
                  '<input id="followUpInput" type="text" class="input-box" placeholder="질문할 내용을 입력하세요 (예: 왜 3번이 정답인지 쉽게 설명해줘)" />' +
                  '<button type="button" class="btn btn-primary btn-sm" id="askFollowUpBtn">질문</button>' +
                '</div>' +
                (fHist.length > 0
                  ? '<div style="display:flex;flex-direction:column;gap:8px">' +
                    fHist.map(function (h) {
                      return '<div class="subpanel" style="padding:10px 12px">' +
                        '<div style="font-size:12px;font-weight:700;color:var(--primary)">Q. ' + escapeHtml(h.question) + '</div>' +
                        '<div style="font-size:12.5px;margin-top:4px;line-height:1.55;white-space:pre-wrap">' + escapeHtml(h.answer) + '</div>' +
                      '</div>';
                    }).join('') +
                    '</div>'
                  : '') +
              '</div>';

            workspaceHtml =
              '<article class="card">' +
                '<div class="ws-header">' +
                  '<div style="flex:1;min-width:240px">' +
                    '<div class="tag-row">' +
                      '<span class="tag-badge blue">' + escapeHtml(getLangLabel(selected.languageFormat)) + '</span>' +
                      (selected.sourceTag ? '<span class="tag-badge">' + escapeHtml(selected.sourceTag) + '</span>' : '') +
                      '<span class="font-mono-tabular">' + formatDate(selected.createdAt) + '</span>' +
                    '</div>' +
                    '<h1 class="ws-title">' + escapeHtml(selected.title) + '</h1>' +

                  '</div>' +
                  '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
                    '<button type="button" class="btn btn-sm ' + (selected.studyStatus === 'mastered' ? 'btn-dark' : 'btn-outline') + '" id="toggleStatusBtn">' +
                      (selected.studyStatus === 'mastered' ? '이해 완료 ✓' : '복습 필요') +

                    (!state.confirmDelete
                      ? '<button type="button" class="btn btn-danger-soft btn-sm" id="askDeleteBtn">삭제</button>'

                    '<div class="tab-bar">' +
                      tabs.map(function (t) {
                        return '<button type="button" class="tab-btn ' + (state.activeTab === t.id ? 'active' : '') + '" data-tab="' + t.id + '">' + escapeHtml(t.label) + '</button>';

                    '<div class="ws-body">' + tabBody + followUpHtml + '</div>' +
                  '</div>' +

        function renderVocabView() {
          var all = [];
          state.posts.forEach(function (p) {
            (p.analysis.vocabulary || []).forEach(function (v) {
              all.push({ postId: p.id, postTitle: p.title, v: v });
            });
          });
          var filtered = all.filter(function (row) {
            if (state.vocabFilter === 'unmemorized') return !row.v.memorized;
            if (state.vocabFilter === 'memorized') return row.v.memorized;
            return true;
          });

          return '<section class="card" style="padding:24px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px">' +
              '<div>' +
                '<h1 class="font-editorial" style="margin:0;font-size:24px">내 단어장 (' + all.length + '개)</h1>' +
                '<p style="margin:4px 0 0;font-size:13px;color:var(--text-muted)">저장된 모든 학습 노트의 핵심 어휘를 한곳에서 암기 테스트할 수 있습니다.</p>' +
              '</div>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
                '<button type="button" class="btn btn-sm ' + (state.vocabHideMeanings ? 'btn-dark' : 'btn-outline') + '" id="vocabHideBtn">' + (state.vocabHideMeanings ? '뜻 가리기 모드 ON' : '뜻 가리기 암기') + '</button>' +
                ['all:전체', 'unmemorized:미암기', 'memorized:암기완료'].map(function (pair) {
                  var p = pair.split(':');
                  return '<button type="button" class="btn btn-sm ' + (state.vocabFilter === p[0] ? 'btn-primary' : 'btn-soft') + '" data-vfilter="' + p[0] + '">' + p[1] + '</button>';
                }).join('') +
              '</div>' +
            '</div>' +
            (filtered.length === 0
              ? '<div style="padding:40px;text-align:center;color:var(--text-subtle);font-size:13px">표시할 단어가 없습니다.</div>'
              : '<div class="vocab-grid">' +
                filtered.map(function (row) {
                  var hidden = state.vocabHideMeanings && !state.revealedVocab[row.v.id];
                  return '<div class="step-card">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center">' +
                      '<div><strong style="font-size:16px">' + escapeHtml(row.v.word) + '</strong> <span style="font-size:11px;color:var(--text-subtle)">' + escapeHtml(row.v.partOfSpeech) + '</span></div>' +
                      '<button type="button" class="btn btn-sm ' + (row.v.memorized ? 'btn-dark' : 'btn-outline') + '" data-vault-vocab="' + escapeHtml(row.postId + '::' + row.v.id) + '">' + (row.v.memorized ? '완료' : '암기') + '</button>' +
                    '</div>' +
                    (hidden
                      ? '<button type="button" class="btn btn-soft btn-sm" data-reveal-vocab="' + escapeHtml(row.v.id) + '">클릭해서 뜻 확인</button>'
                      : '<div style="font-size:13.5px;font-weight:600">' + escapeHtml(row.v.meaning) + '</div>') +
                    '<div style="font-size:11.5px;color:var(--text-subtle)">' + escapeHtml(row.v.exampleInPassage) + '</div>' +
                    '<button type="button" style="background:none;border:none;padding:0;text-align:left;font-size:11px;color:var(--primary);font-weight:600" data-jump-post="' + escapeHtml(row.postId) + '">출처 노트: ' + escapeHtml(row.postTitle) + ' →</button>' +
                  '</div>';
                }).join('') +
                '</div>') +
          '</section>';
        }

          return '<section class="card" style="padding:28px;max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px">' +

            '</div>' +

              '<div class="kpi-card"><div style="font-size:12px;color:var(--text-subtle)">저장된 노트</div><div class="font-mono-tabular" style="font-size:22px;font-weight:700;margin:4px 0">' + state.posts.length + '건</div><div style="font-size:11px;color:var(--text-subtle)">문제 ' + prob + ' · 영작 ' + writ + ' · 원문 ' + pass + '</div></div>' +
              '<div class="kpi-card"><div style="font-size:12px;color:var(--text-subtle)">이해 완료</div><div class="font-mono-tabular" style="font-size:22px;font-weight:700;color:var(--emerald);margin:4px 0">' + mast + '건</div><div style="font-size:11px;color:var(--text-subtle)">복습 필요 ' + (state.posts.length - mast) + '건</div></div>' +
              '<div class="kpi-card"><div style="font-size:12px;color:var(--text-subtle)">누적 어휘</div><div class="font-mono-tabular" style="font-size:22px;font-weight:700;margin:4px 0">' + voc + '개</div><div style="font-size:11px;color:var(--text-subtle)">단어장 복습 가능</div></div>' +
              '<div class="kpi-card"><div style="font-size:12px;color:var(--text-subtle)">로컬 용량</div><div class="font-mono-tabular" style="font-size:22px;font-weight:700;margin:4px 0">' + formatBytes(bytes) + '</div><div style="font-size:11px;color:var(--text-subtle)">브라우저 저장</div></div>' +
            '</div>' +
            (state.backupNotice ? '<div class="notice-box ' + state.backupNotice.type + '">' + escapeHtml(state.backupNotice.text) + '</div>' : '') +
            '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:14px">' +
              '<div class="subpanel" style="display:flex;flex-direction:column;gap:10px">' +
                '<strong style="font-size:14px">JSON 백업 파일 내보내기</strong>' +
                '<p style="margin:0;font-size:12.5px;color:var(--text-muted)">저장된 사진, 풀이, 메모를 하나의 JSON 파일로 내려받습니다.</p>' +
                '<div><button type="button" class="btn btn-dark btn-sm" id="exportJsonBtn">JSON 백업 다운로드</button></div>' +
              '</div>' +
              '<div class="subpanel" style="display:flex;flex-direction:column;gap:10px">' +
                '<strong style="font-size:14px">JSON 백업 파일 불러오기</strong>' +
                '<p style="margin:0;font-size:12.5px;color:var(--text-muted)">저장해 둔 PassageNote JSON 파일을 선택해 기존 노트와 합칩니다.</p>' +
                '<input type="file" id="importJsonInput" accept="application/json,.json" style="display:none" />' +
                '<div><button type="button" class="btn btn-outline btn-sm" id="importJsonBtn">JSON 파일 선택</button></div>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-top:1px solid var(--border);padding-top:16px">' +

                '<p style="margin:6px 0 0;color:var(--text-muted)">원하는 답변 조건과 질문할 문장·지문을 아래 칸에 적고 질문해 보세요. 현재 보고 있는 노트를 연결해 바로 풀이·점검을 받을 수 있습니다.</p>' +
              '</div>' +
              '<button type="button" class="choice-card" style="font-size:12.5px" data-starter="이 문제를 어떤 방식으로 풀이해주면 좋을지 먼저 추천받고 선택하고 싶어요!">' +
                '이 문제를 어떤 방식으로 풀이해주면 좋을지 먼저 추천받고 선택하고 싶어요!' +
              '</button>' +
              '<button type="button" class="choice-card" style="font-size:12.5px" data-starter="현재 노트의 핵심 문법과 단어 퀴즈를 1문제 내주세요.">' +
                '현재 노트의 핵심 문법과 단어 퀴즈를 1문제 내주세요.' +

                (m.customContent ? '<div style="font-size:11px;opacity:0.9;margin-bottom:6px;background:rgba(0,0,0,0.16);padding:6px;border-radius:6px">' + escapeHtml(m.customContent) + '</div>' : '') +

        function generateLocalCoachReply(question, condition, content, post, roleId, styleId) {
          var styleLabel = (SOLVE_STYLES.find(function (s) { return s.id === styleId; }) || SOLVE_STYLES[0]).label;
          var lines = [];
          lines.push('[' + styleLabel + (condition ? ' · 지정 조건: ' + condition : '') + ']');

          var targetText = content || (post ? post.analysis.extractedText : '');
          if (/방식|어떻게|추천/.test(question)) {
            lines.push('');
            lines.push('이 자료는 아래 4가지 방식 중 편한 순서대로 골라 풀이하면 가장 이해가 빠릅니다:');
            lines.push('1. [초보 눈높이] 문장의 주어·동사 뼈대만 먼저 찾은 뒤 수식어를 덧붙여 읽기');
            lines.push('2. [단계별 풀이] 1단계(근거 문장 찾기) → 2단계(선지·조건 대조) → 3단계(오답 소거)');
            lines.push('3. [내신·함정 대비] 관계대명사·도치·시제/수일치 변형 포인트 위주로 체크');
            lines.push('4. [직독직해 3줄 요약] "/" 끊어읽기 순서대로 핵심 요지 3문장 정리');
            return lines.join('\n');
          }

          if (roleId === 'quick_quiz' || /퀴즈/.test(question + ' ' + condition)) {
            var vocs = post && post.analysis.vocabulary ? post.analysis.vocabulary : [];
            if (vocs.length > 0) {
              var v = vocs[Math.floor(Math.random() * vocs.length)];
              lines.push('');
              lines.push('[스피드 어휘 퀴즈]');
              lines.push('단어: "' + v.word + '" (' + v.partOfSpeech + ')');
              lines.push('예문: "' + v.exampleInPassage + '"');
              lines.push('정답/뜻: ' + v.meaning + (v.synonyms && v.synonyms.length ? ' (유의어: ' + v.synonyms.join(', ') + ')' : ''));
              return lines.join('\n');
            }
          }

          if (targetText) {
            var patterns = detectGrammarPatterns(targetText);
            var chunkPreview = splitIntoChunked(targetText.split(/[.!?]/)[0] || targetText.slice(0, 140));
            lines.push('');
            if (/직독|끊어|읽/.test(condition + question) || styleId === 'beginner') {
              lines.push('• 직독직해 끊어읽기 예시:');
              lines.push('  ' + chunkPreview);
            }
            if (patterns.length > 0) {
              lines.push('• 감지된 핵심 구문:');
              patterns.forEach(function (pt) {
                lines.push('  - ' + pt.pointTitle + ' (' + pt.targetPhrase + '): ' + pt.explanation);
              });
            }
            if (post && post.analysis.problemSection && /정답|선지|오답|3줄|요약/.test(condition + question)) {
              lines.push('• 정답 및 핵심 근거:');
              lines.push('  정답 ' + post.analysis.problemSection.correctAnswer + ' — ' + post.analysis.problemSection.answerSummary);
            }
            if (post && post.analysis.writingSection) {
              lines.push('• 영작 핵심 체크:');
              lines.push('  모범 표현: ' + post.analysis.writingSection.modelAnswer);
              if (post.analysis.writingSection.deductionPoints.length > 0) {
                lines.push('  주의점: ' + post.analysis.writingSection.deductionPoints[0]);
              }
            }
          } else {
            lines.push('');
            lines.push('현재 연결된 지문이 없습니다. 위 "질문할 내용" 칸에 영어 문장이나 문제를 붙여넣고 다시 질문하시면 구문과 직독직해 포인트를 바로 분석해 드립니다.');
          }
          return lines.join('\n');
        }

        function render() {
          renderTopNav();
          var root = document.getElementById('appRoot');
          if (state.activeView === 'vocab') root.innerHTML = renderVocabView();
          else if (state.activeView === 'backup') root.innerHTML = renderBackupView();
          else root.innerHTML = renderFeedAndWorkspace();
          renderSnapModal();
          renderTutorDrawer();
        }

        // Delegated Click Handlers
        document.addEventListener('click', function (e) {
          var t = e.target.closest('button');
          if (!t) return;

          if (t.dataset.nav) {
            state.activeView = t.dataset.nav;
            render();
            return;
          }
          if (t.id === 'brandHomeBtn') {
            state.activeView = 'feed';
            render();
            return;
          }
          if (t.id === 'openSnapBtn' || t.id === 'emptySnapBtn') {
            state.snapOpen = true;
            renderSnapModal();
            return;
          }
          if (t.id === 'closeSnapBtn' || t.id === 'cancelSnapBtn') {
            state.snapOpen = false;
            renderSnapModal();
            return;
          }
          if (t.id === 'snapTabPhotoBtn') {
            state.snapTab = 'photo';
            renderSnapModal();
            return;
          }
          if (t.id === 'snapTabTextBtn') {
            state.snapTab = 'text';
            renderSnapModal();
            return;
          }
          if (t.id === 'pickFilesBtn') {
            document.getElementById('snapFileInput').click();
            return;
          }
          if (t.dataset.snapIdx !== undefined) {
            state.snapActivePhotoIdx = Number(t.dataset.snapIdx);
            renderSnapModal();
            return;
          }
          if (t.dataset.snapStyle) {
            state.snapStyle = t.dataset.snapStyle;
            renderSnapModal();
            return;
          }
          if (t.id === 'rotateLeftBtn' || t.id === 'rotateRightBtn') {
            var actPh = state.snapPhotos[state.snapActivePhotoIdx];
            if (!actPh) return;
            rotateDataUrl(actPh.rawUrl, t.id === 'rotateLeftBtn' ? -90 : 90).then(function (url) {
              actPh.rawUrl = url;
              actPh.cropRect = null;
              renderSnapModal();
            });
            return;
          }
          if (t.id === 'resetCropBtn') {
            if (state.snapPhotos[state.snapActivePhotoIdx]) {
              state.snapPhotos[state.snapActivePhotoIdx].cropRect = null;
              renderSnapModal();
            }
            return;
          }
          if (t.id === 'moveLeftBtn' && state.snapActivePhotoIdx > 0) {
            var idxL = state.snapActivePhotoIdx;
            var tmpL = state.snapPhotos[idxL - 1];
            state.snapPhotos[idxL - 1] = state.snapPhotos[idxL];
            state.snapPhotos[idxL] = tmpL;
            state.snapActivePhotoIdx = idxL - 1;
            renderSnapModal();
            return;
          }
          if (t.id === 'moveRightBtn' && state.snapActivePhotoIdx < state.snapPhotos.length - 1) {
            var idxR = state.snapActivePhotoIdx;
            var tmpR = state.snapPhotos[idxR + 1];
            state.snapPhotos[idxR + 1] = state.snapPhotos[idxR];
            state.snapPhotos[idxR] = tmpR;
            state.snapActivePhotoIdx = idxR + 1;
            renderSnapModal();
            return;
          }
          if (t.id === 'removePhotoBtn') {
            state.snapPhotos.splice(state.snapActivePhotoIdx, 1);
            state.snapActivePhotoIdx = Math.max(0, Math.min(state.snapActivePhotoIdx, state.snapPhotos.length - 1));
            renderSnapModal();
            return;
          }

          if (t.dataset.typefilter) {
            state.typeFilter = t.dataset.typefilter;
            render();
            return;
          }
          if (t.dataset.selectPost) {
            selectPost(t.dataset.selectPost);
            return;
          }
          if (t.dataset.leftmode) {
            state.leftMode = t.dataset.leftmode;
            render();
            return;
          }
          if (t.dataset.viewphoto !== undefined) {
            state.activePhotoIndex = Number(t.dataset.viewphoto);
            render();
            return;
          }
          if (t.id === 'zoomInBtn') {
            state.zoom = Math.min(2, state.zoom + 0.25);
            render();
            return;
          }
          if (t.id === 'zoomOutBtn') {
            state.zoom = Math.max(0.75, state.zoom - 0.25);
            render();
            return;
          }
          if (t.dataset.tab) {
            state.activeTab = t.dataset.tab;
            render();
            return;
          }
          if (t.dataset.litmode) {
            state.literalMode = t.dataset.litmode;
            render();
            return;
          }
          if (t.dataset.pickChoice) {
            state.choiceDraft = t.dataset.pickChoice;
            render();
            return;
          }
          if (t.id === 'checkChoiceBtn') {
            var selP = getSelectedPost();
            if (selP && state.choiceDraft) {
              state.revealedProblem = true;
              updatePostById(selP.id, function (p) {
                return Object.assign({}, p, { userSelectedChoice: state.choiceDraft, updatedAt: Date.now() });
              });
              render();
            }
            return;
          }
          if (t.id === 'toggleProblemRevealBtn') {
            state.revealedProblem = !state.revealedProblem;
            render();
            return;
          }
          if (t.id === 'toggleModelHideBtn') {
            state.hideModelAnswer = !state.hideModelAnswer;
            render();
            return;
          }
          if (t.id === 'checkWritingBtn') {
            var wp = getSelectedPost();
            if (!wp || !state.writingDraft.trim()) return;
            var ans = state.writingDraft.trim();
            var wsSec = wp.analysis.writingSection;
            var missingWords = (wsSec.givenWords || []).filter(function (w) {
              return ans.toLowerCase().indexOf(w.toLowerCase().slice(0, Math.max(3, w.length - 1))) === -1;
            });
            var exactMatch = wsSec.modelAnswer && ans.toLowerCase().replace(/[.!?]+$/, '') === wsSec.modelAnswer.toLowerCase().replace(/[.!?]+$/, '');
            var verdict = exactMatch ? 'correct' : (missingWords.length === 0 ? 'partial' : 'needs_revision');
            var label = exactMatch ? '모범 답안과 일치!' : (missingWords.length === 0 ? '<보기> 단어 모두 포함 · 어순 확인 필요' : '누락된 <보기> 단어 ' + missingWords.length + '개');
            var fb = exactMatch
              ? '어순, 철자, <조건>까지 모범 답안과 정확히 일치합니다.'
              : (missingWords.length > 0 ? '빠진 <보기> 단어: ' + missingWords.join(', ') + '. ' : '<보기> 단어는 모두 들어갔습니다. ') +
                (wsSec.modelAnswer && wsSec.modelAnswer.indexOf('(') !== 0 ? '참고 모범 답안: ' + wsSec.modelAnswer : '영작 빌드업 1~4단계와 대조해 시제·어순을 점검해 보세요.');
            var attempt = { id: 'att-' + Date.now(), createdAt: Date.now(), userAnswer: ans, verdict: verdict, scoreLabel: label, feedbackKorean: fb };
            updatePostById(wp.id, function (p) {
              return Object.assign({}, p, { writingAttempts: [attempt].concat(p.writingAttempts || []), updatedAt: Date.now() });
            });
            render();
            return;
          }
          if (t.dataset.toggleVocab) {
            var spv = getSelectedPost();
            if (!spv) return;
            var vid = t.dataset.toggleVocab;
            updatePostById(spv.id, function (p) {
              return Object.assign({}, p, {
                analysis: Object.assign({}, p.analysis, {
                  vocabulary: p.analysis.vocabulary.map(function (v) { return v.id === vid ? Object.assign({}, v, { memorized: !v.memorized }) : v; })
                })
              });
            });
            render();
            return;
          }
          if (t.id === 'toggleStatusBtn') {
            var stP = getSelectedPost();
            if (!stP) return;
            updatePostById(stP.id, function (p) {
              return Object.assign({}, p, { studyStatus: p.studyStatus === 'mastered' ? 'review_needed' : 'mastered', updatedAt: Date.now() });
            });
            render();
            return;
          }
          if (t.id === 'askDeleteBtn') {
            state.confirmDelete = true;
            render();
            return;
          }
          if (t.id === 'cancelDeleteBtn') {
            state.confirmDelete = false;
            render();
            return;
          }
          if (t.id === 'confirmDeleteBtn') {
            var delP = getSelectedPost();
            if (!delP) return;
            state.posts = state.posts.filter(function (p) { return p.id !== delP.id; });
            savePosts(state.posts);
            state.selectedPostId = state.posts[0] ? state.posts[0].id : null;
            state.confirmDelete = false;
            render();
            return;
          }
          if (t.dataset.fstyle) {
            state.followUpStyle = t.dataset.fstyle;
            render();
            return;
          }
          if (t.dataset.fqpreset) {
            var fi = document.getElementById('followUpInput');
            if (fi) { fi.value = t.dataset.fqpreset; fi.focus(); }
            return;
          }
          if (t.id === 'askFollowUpBtn') {
            var fP = getSelectedPost();
            var qEl = document.getElementById('followUpInput');
            var qVal = qEl ? qEl.value.trim() : '';
            if (!fP || !qVal) return;
            var ansText = generateLocalCoachReply(qVal, '', '', fP, 'tutor', state.followUpStyle);
            updatePostById(fP.id, function (p) {
              return Object.assign({}, p, {
                followUpHistory: (p.followUpHistory || []).concat([{ id: 'fq-' + Date.now(), question: qVal, answer: ansText, createdAt: Date.now() }])
              });
            });
            render();
            return;
          }

          // Vocab vault
          if (t.id === 'vocabHideBtn') {
            state.vocabHideMeanings = !state.vocabHideMeanings;
            state.revealedVocab = {};
            render();
            return;
          }
          if (t.dataset.vfilter) {
            state.vocabFilter = t.dataset.vfilter;
            render();
            return;
          }
          if (t.dataset.revealVocab) {
            state.revealedVocab[t.dataset.revealVocab] = true;
            render();
            return;
          }
          if (t.dataset.vaultVocab) {
            var pairV = t.dataset.vaultVocab.split('::');
            updatePostById(pairV[0], function (p) {
              return Object.assign({}, p, {
                analysis: Object.assign({}, p.analysis, {
                  vocabulary: p.analysis.vocabulary.map(function (v) { return v.id === pairV[1] ? Object.assign({}, v, { memorized: !v.memorized }) : v; })
                })
              });
            });
            render();
            return;
          }
          if (t.dataset.jumpPost) {
            state.activeView = 'feed';
            selectPost(t.dataset.jumpPost);
            return;
          }

          // Backup actions
          if (t.id === 'exportJsonBtn') {
            var blob = new Blob([JSON.stringify({ app: 'PassageNote', version: 2, exportedAt: new Date().toISOString(), posts: state.posts }, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'passagenote-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            state.backupNotice = { type: 'success', text: '학습 노트 ' + state.posts.length + '건을 JSON 파일로 내보냈습니다.' };
            render();
            return;
          }
          if (t.id === 'importJsonBtn') {
            document.getElementById('importJsonInput').click();
            return;
          }
          if (t.id === 'restoreSamplesBtn') {
            var samples = createSamplePosts();
            var existingMap = {};
            state.posts.forEach(function (p) { existingMap[p.id] = p; });
            samples.forEach(function (s) { existingMap[s.id] = s; });
            state.posts = Object.keys(existingMap).map(function (k) { return existingMap[k]; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
            savePosts(state.posts);
            state.backupNotice = { type: 'success', text: '예시 노트 3종을 다시 불러왔습니다.' };
            render();
            return;
          }
          if (t.id === 'askClearAllBtn') {
            state.confirmClearAll = true;
            render();
            return;
          }
          if (t.id === 'cancelClearAllBtn') {
            state.confirmClearAll = false;
            render();
            return;
          }
          if (t.id === 'confirmClearAllBtn') {
            state.posts = [];
            state.selectedPostId = null;
            state.confirmClearAll = false;
            savePosts(state.posts);
            state.backupNotice = { type: 'success', text: '모든 학습 노트를 비웠습니다.' };
            render();
            return;
          }

          // Tutor drawer actions
          if (t.id === 'openTutorBtn') {
            state.tutorOpen = true;
            renderTutorDrawer();
            return;
          }
          if (t.id === 'closeTutorBtn') {
            state.tutorOpen = false;
            renderTutorDrawer();
            return;
          }
          if (t.id === 'resetChatBtn') {
            state.tutorMessages = [];
            saveChat([]);
            renderTutorDrawer();
            return;
          }
          if (t.id === 'toggleCustomCondBtn') {
            state.tutorCustomOpen = !state.tutorCustomOpen;
            renderTutorDrawer();
            return;
          }
          if (t.id === 'clearCustomCondBtn') {
            state.tutorCondition = '';
            document.getElementById('tutorCustomCondition').value = '';
            document.getElementById('tutorCustomContent').value = '';
            renderTutorDrawer();
            return;
          }
          if (t.id === 'importNoteTextBtn') {
            var curPost = getSelectedPost();
            if (curPost) {
              document.getElementById('tutorCustomContent').value = curPost.analysis.extractedText || '';
              renderTutorDrawer();
            }
            return;
          }
          if (t.dataset.trole) {
            state.tutorRole = t.dataset.trole;
            renderTutorDrawer();
            return;
          }
          if (t.dataset.tstyle) {
            state.tutorStyle = t.dataset.tstyle;
            renderTutorDrawer();
            return;
          }
          if (t.dataset.tpreset) {
            var pre = t.dataset.tpreset;
            var toks = state.tutorCondition.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            var posIdx = toks.indexOf(pre);
            if (posIdx !== -1) toks.splice(posIdx, 1);
            else toks.push(pre);
            state.tutorCondition = toks.join(', ');
            document.getElementById('tutorCustomCondition').value = state.tutorCondition;
            renderTutorDrawer();
            return;
          }
          if (t.dataset.starter) {
            submitTutorMessage(t.dataset.starter);
            return;
          }
        });

        document.getElementById('tutorBackdropSpacer').addEventListener('click', function () {
          state.tutorOpen = false;
          renderTutorDrawer();
        });

        // Delegated Input / Change Handlers
        var memoTimer = null;
        document.addEventListener('input', function (e) {
          var el = e.target;
          if (el.id === 'feedSearchInput') {
            state.searchQuery = el.value;
            render();
            var refocused = document.getElementById('feedSearchInput');
            if (refocused) {
              refocused.focus();
              refocused.setSelectionRange(refocused.value.length, refocused.value.length);
            }
          } else if (el.id === 'memoTextarea') {
            var p = getSelectedPost();
            if (!p) return;
            var val = el.value;
            clearTimeout(memoTimer);
            memoTimer = setTimeout(function () {
              updatePostById(p.id, function (item) { return Object.assign({}, item, { userMemo: val, updatedAt: Date.now() }); });
              var tag = document.getElementById('memoSavedTag');
              if (tag) {
                tag.style.display = 'inline';
                setTimeout(function () { if (tag) tag.style.display = 'none'; }, 1500);
              }
            }, 350);
          } else if (el.id === 'writingPracticeInput') {
            state.writingDraft = el.value;
          } else if (el.id === 'tutorCustomCondition') {
            state.tutorCondition = el.value;
            renderTutorDrawer();
          } else if (el.id === 'tutorCustomContent') {
            document.getElementById('clearCustomCondBtn').style.display =
              (el.value.trim() || state.tutorCondition.trim()) ? 'inline-flex' : 'none';
          }
        });

        document.addEventListener('change', function (e) {
          var el = e.target;
          if (el.id === 'toggleEvidenceChk') {
            state.highlightEvidence = el.checked;
            render();
          } else if (el.id === 'importJsonInput') {
            var file = el.files && el.files[0];
            el.value = '';
            if (!file) return;
            file.text().then(function (raw) {
              var parsed = JSON.parse(raw);
              var arr = Array.isArray(parsed) ? parsed : (parsed && parsed.posts);
              if (!Array.isArray(arr)) throw new Error('올바른 PassageNote 백업 파일이 아닙니다.');
              var map = {};
              state.posts.forEach(function (p) { map[p.id] = p; });
              var count = 0;
              arr.forEach(function (item) {
                if (item && item.id && item.title && item.analysis) {
                  map[item.id] = item;
                  count++;
                }
              });
              state.posts = Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
              savePosts(state.posts);
              state.backupNotice = { type: 'success', text: '총 ' + count + '건의 노트를 병합했습니다.' };
              render();
            }).catch(function (err) {
              state.backupNotice = { type: 'error', text: err.message || '파일을 읽지 못했습니다.' };
              render();
            });
          }
        });

        // Photo Upload / Drop / Paste / Crop Handlers
        function addImageFiles(fileList) {
          var files = Array.prototype.slice.call(fileList || []);
          var remaining = MAX_PHOTOS - state.snapPhotos.length;
          if (remaining <= 0) return;
          files.slice(0, remaining).forEach(function (f) {
            if (f.type && f.type.indexOf('image/') !== 0) return;
            readFileAsDataUrl(f).then(function (url) {
              state.snapPhotos.push({ id: 'ph-' + Date.now() + Math.random(), rawUrl: url, cropRect: null });
              state.snapActivePhotoIdx = state.snapPhotos.length - 1;
              renderSnapModal();
            });
          });
        }

        document.getElementById('snapFileInput').addEventListener('change', function (e) {
          addImageFiles(e.target.files);
          e.target.value = '';
        });

        var dz = document.getElementById('snapDropzone');
        dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('dragging'); });
        dz.addEventListener('dragleave', function () { dz.classList.remove('dragging'); });
        dz.addEventListener('drop', function (e) {
          e.preventDefault();
          dz.classList.remove('dragging');
          addImageFiles(e.dataTransfer.files);
        });

        window.addEventListener('paste', function (e) {
          var items = e.clipboardData && e.clipboardData.items;
          if (!items) return;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image/') === 0) {
              var file = items[i].getAsFile();
              if (!file) continue;
              e.preventDefault();
              readFileAsDataUrl(file).then(function (url) {
                state.snapOpen = true;
                state.snapTab = 'photo';
                if (state.snapPhotos.length < MAX_PHOTOS) {
                  state.snapPhotos.push({ id: 'ph-' + Date.now(), rawUrl: url, cropRect: null });
                  state.snapActivePhotoIdx = state.snapPhotos.length - 1;
                }
                renderSnapModal();
              });
              break;
            }
          }
        });

        var cropStage = document.getElementById('cropStage');
        function getNormPos(ev) {
          var r = cropStage.getBoundingClientRect();
          return {
            x: Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)),
            y: Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))
          };
        }
        cropStage.addEventListener('pointerdown', function (e) {
          if (!state.snapPhotos[state.snapActivePhotoIdx]) return;
          state.snapDragging = true;
          state.snapDragStart = getNormPos(e);
        });
        window.addEventListener('pointermove', function (e) {
          if (!state.snapDragging || !state.snapDragStart) return;
          var cur = getNormPos(e);
          var act = state.snapPhotos[state.snapActivePhotoIdx];
          if (!act) return;
          act.cropRect = {
            x: Math.min(state.snapDragStart.x, cur.x),
            y: Math.min(state.snapDragStart.y, cur.y),
            width: Math.abs(cur.x - state.snapDragStart.x),
            height: Math.abs(cur.y - state.snapDragStart.y)
          };
          renderSnapModal();
        });
        window.addEventListener('pointerup', function () {
          if (!state.snapDragging) return;
          state.snapDragging = false;
          state.snapDragStart = null;
          var act = state.snapPhotos[state.snapActivePhotoIdx];
          if (act && act.cropRect && (act.cropRect.width < 0.04 || act.cropRect.height < 0.04)) {
            act.cropRect = null;
            renderSnapModal();
          }
        });

        // Snap Form Submit
        document.getElementById('snapForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var errBox = document.getElementById('snapErrorBox');
          errBox.style.display = 'none';

          var rawText = state.snapTab === 'text'
            ? document.getElementById('snapTextInput').value.trim()
            : document.getElementById('snapPhotoTextNote').value.trim();

          if (state.snapTab === 'photo' && state.snapPhotos.length === 0 && !rawText) {
            errBox.textContent = '사진을 1장 이상 첨부하거나 텍스트를 입력해 주세요.';
            errBox.style.display = 'block';
            return;
          }
          if (state.snapTab === 'text' && !rawText) {
            errBox.textContent = '분석할 문제 또는 영어 원문을 입력해 주세요.';
            errBox.style.display = 'block';
            return;
          }

          var sourceTag = document.getElementById('snapSourceTag').value.trim();
          var modeSel = document.getElementById('snapModeSelect').value;
          var solveNote = document.getElementById('snapSolveNote').value.trim();

          var photoTasks = state.snapTab === 'photo'
            ? state.snapPhotos.map(function (ph) {
                return compressAndCrop(ph.rawUrl, ph.cropRect, state.snapPhotos.length >= 4 ? 1080 : 1280);
              })
            : [];

          Promise.all(photoTasks).then(function (compressedList) {
            var analysis = analyzeLocally(rawText, {
              requestedType: modeSel,
              sourceTag: sourceTag,
              solveNote: solveNote
            });
            var now = Date.now();
            var newPost = {
              id: 'post-' + now,
              createdAt: now,
              updatedAt: now,
              title: analysis.title,
              sourceTag: sourceTag,
              languageFormat: analysis.languageFormat,
              postType: analysis.detectedPostType,
              studyStatus: 'review_needed',
              imageDataUrls: compressedList,
              solvePreference: state.snapStyle,
              solveRequestNote: solveNote,
              userMemo: '',
              userSelectedChoice: null,
              writingAttempts: [],
              followUpHistory: [],
              analysis: analysis
            };
            state.posts.unshift(newPost);
            savePosts(state.posts);

            state.snapOpen = false;
            state.snapPhotos = [];
            state.snapActivePhotoIdx = 0;
            document.getElementById('snapTextInput').value = '';
            document.getElementById('snapPhotoTextNote').value = '';
            document.getElementById('snapSourceTag').value = '';
            document.getElementById('snapSolveNote').value = '';
            state.activeView = 'feed';
            selectPost(newPost.id);
          });
        });

        // Tutor Chat Submit
        function submitTutorMessage(overrideText) {
          var inputEl = document.getElementById('tutorInput');
          var q = (overrideText !== undefined ? overrideText : inputEl.value).trim();
          var cond = document.getElementById('tutorCustomCondition').value.trim();
          var cont = document.getElementById('tutorCustomContent').value.trim();
          if (!q && !cont) return;

          var attachChk = document.getElementById('tutorAttachContext').checked;
          var activePost = attachChk ? getSelectedPost() : null;

          var displayQ = q || '위 조건과 첨부한 내용에 맞춰 풀이·점검해 주세요.';
          state.tutorMessages.push({
            id: 'u-' + Date.now(),
            role: 'user',
            text: displayQ,
            customCondition: cond || undefined,
            customContent: cont || undefined,
            createdAt: Date.now()
          });

          var reply = generateLocalCoachReply(displayQ, cond, cont, activePost, state.tutorRole, state.tutorStyle);
          state.tutorMessages.push({
            id: 'm-' + (Date.now() + 1),
            role: 'model',
            text: reply,
            createdAt: Date.now()
          });

          saveChat(state.tutorMessages);
          if (overrideText === undefined) inputEl.value = '';
          document.getElementById('tutorCustomContent').value = '';
          renderTutorDrawer();
        }

        document.getElementById('tutorForm').addEventListener('submit', function (e) {
          e.preventDefault();
          submitTutorMessage();
        });

        document.getElementById('tutorInput').addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submitTutorMessage();
          }
        });

        render();
      })();
    </script>
  </body>
</html>
